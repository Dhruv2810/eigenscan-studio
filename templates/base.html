<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>{% block title %}EigenScan Studio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="ambient ambient-c"></div>

    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="EigenScan Studio home">
            <span class="brand-mark">
                <span class="brand-pulse"></span>
            </span>
            <span>
                <strong>EigenScan</strong>
                <small>Studio</small>
            </span>
        </a>

        <nav class="main-nav">
            <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
            <a href="{{ url_for('learning') }}" class="{% if request.endpoint == 'learning' %}active{% endif %}">Analysis</a>
            <a href="{{ url_for('predict_page') }}" class="{% if request.endpoint == 'predict_page' %}active{% endif %}">Predictor</a>
        </nav>

        <a class="nav-cta" href="{{ url_for('predict_page') }}">Run model</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-line"></div>
        <div class="footer-inner">
            <span>Breast Cancer Detection using PCA, LDA and SVM</span>
            <strong>Powered By - Dhruv Parekh</strong>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
